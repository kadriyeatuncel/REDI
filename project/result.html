<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Personal Munich Plan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); min-height: 100vh; padding: 40px 20px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .weather-dashboard { background: #0052cc; color: white; padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 30px; }
        .weather-dashboard h3 { font-size: 40px; margin: 0; }
        .stats { display: flex; justify-content: space-around; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; }
        ul { padding: 0; list-style: none; }
        li { background: #f9f9f9; padding: 15px; margin-bottom: 12px; border-radius: 12px; display: flex; align-items: center; border: 1px solid #eee; transition: 0.2s; }
        li:hover { transform: translateX(5px); border-color: #0052cc; }
        li i { color: #2ecc71; margin-right: 15px; }
        .back-link { display: block; text-align: center; margin-top: 30px; text-decoration: none; color: #0052cc; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fa-solid fa-map-location-dot"></i> Your Munich Plan</h1>
        <div class="weather-dashboard">
            <h3>{{ weather.temp }}°C</h3>
            <p>{{ weather.desc }}</p>
            <div class="stats">
                <span><i class="fa-solid fa-droplet"></i> Hum: {{ weather.humidity }}%</span>
                <span><i class="fa-solid fa-wind"></i> Wind: {{ weather.wind }} km/h</span>
            </div>
        </div>
        <h2>Recommendations</h2>
        <ul>
            {% for task in tasks %}
                <li><i class="fa-solid fa-circle-check"></i> {{ task }}</li>
            {% endfor %}
        </ul>
        <a href="/" class="back-link">← Change Preferences</a>
    </div>
</body>
</html>
