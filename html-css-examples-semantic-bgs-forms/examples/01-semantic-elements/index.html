<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic Elements Example - ReDI School</title>

  <!-- normalize.css makes default styles look the same across browsers.
  Very popular - to use it, uncomment the line below. -->
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.min.css"> -->

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- <header>: top of the page (logo, site title, navigation) -->
  <header>
    <h1>My ReDI Blog</h1>

    <!-- <nav>: a group of navigation links -->
    <nav>
      <a href="#">Home</a>
      <a href="#">Articles</a>
      <a href="#">About</a>
    </nav>
  </header>

  <!-- <main>: the main content of the page (only one per page) -->
  <main>

    <!-- <section>: a thematic group of content -->
    <section>
      <h2>Latest Articles</h2>

      <!-- <article>: a self-contained piece of content (e.g. a blog post) -->
      <article>
        <h3>Why I started learning to code</h3>
        <p>I joined ReDI to change my career. Here is my story...</p>
      </article>

      <article>
        <h3>My first HTML page</h3>
        <p>Today I learned about semantic elements!</p>
      </article>
    </section>

    <!-- <aside>: extra content related to the main content (sidebar, tips) -->
    <aside>
      <h3>Did you know?</h3>
      <p>Semantic elements help screen readers and search engines.</p>
    </aside>

  </main>

  <!-- <footer>: bottom of the page (copyright, contact) -->
  <footer>
    <p>&copy; 2026 ReDI School</p>
  </footer>

</body>

</html>
